# Keeps the free-tier Supabase project from being paused for inactivity
# (Supabase pauses after 7 days without activity). Runs a tiny read every 3 days.
name: Supabase keep-alive

on:
  schedule:
    - cron: "17 6 */3 * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Query the database
        run: |
          code=$(curl -s -o /dev/null -w "%{http_code}" \
            "https://aqzkmmqhaxdyolgrjfnv.supabase.co/rest/v1/orgs?select=*&limit=1" \
            -H "apikey: sb_publishable_G_xmgKDTydoWQK4NaRDA5A_DWrEkBTe")
          echo "HTTP $code"
          test "$code" = "200"
